<h1>台積電第三季營收創新高</h1>
<p>台積電今日公布第三季財報，單季營收達新台幣七千五百億元，較去年同期成長百分之三十，創下歷史新高。</p>
<p>公司表示，先進製程需求強勁，人工智慧相關晶片訂單持續增加，帶動整體營收表現優於市場預期。</p>
<p>法人指出，第四季營收可望維持成長動能，全年營收成長率有機會超過先前預估。</p>
<p>台積電同時宣布將提高資本支出，以因應未來數年的產能需求，並持續擴大海外布局。</p>
